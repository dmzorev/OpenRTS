infantry-skirmish:
  Version: 2
  Opening: [power-plant, barracks]
  Buildings:
    power-plant: 1
    barracks: 1
  BuildingPriorities: { power-plant: 100, barracks: 50 }
  Sergeants:
    rifle-section:
      Min: 1
      Max: 2
      Priority: 100
      StartCredits: 4200
      RetainCredits: 1800
      UnderThreatStrategy: Guard
    rifle-guard:
      Min: 1
      Max: 1
      Priority: 50
      EarliestTick: 900
  Capture: { Unit: construction-engineer, Action: capture }
  Supply: { Truck: supply-truck, Target: 2, ImproveMines: true }
  Recipes:
    power-plant: { Producer: construction-engineer, Action: site-power }
    barracks: { Producer: construction-engineer, Action: site-barracks }
    supply-truck: { Producer: supply-center, Action: truck }
    construction-engineer: { Producer: supply-center, Action: engineer }
  CreditReserve: 300
  MacroIntervalTicks: 25
  TacticsIntervalTicks: 5
  BlockedGoalTicks: 250

mechanized-skirmish:
  Inherits: infantry-skirmish
  Opening: [power-plant, barracks, factory]
  Buildings:
    factory: 1
  BuildingPriorities: { factory: 25 }
  Sergeants:
    apc-section:
      Min: 1
      Max: 2
      Priority: 100
      StartCredits: 10000
      RetainCredits: 4500
      UnderThreatStrategy: Guard
    rifle-section:
      Max: 1
      Priority: 50
    rifle-guard:
      Min: 0
      Priority: 25
      EarliestTick: 1500
      StartCredits: 3600
      RetainCredits: 1400
  Recipes:
    factory: { Producer: construction-engineer, Action: site-factory }

combined-arms-skirmish:
  Inherits: mechanized-skirmish
  Buildings:
    power-plant: 2
    helipad: 1
    airfield: 1
  BuildingPriorities: { helipad: 20, airfield: 10 }
  Sergeants:
    -rifle-section:
    -rifle-guard:
    apc-section: { Max: 1 }
    specialist-section: { Min: 1, Max: 1, Priority: 90 }
    armor-section: { Min: 1, Max: 2, Priority: 120, EarliestTick: 400 }
    artillery-section: { Min: 0, Max: 1, Priority: 100, EarliestTick: 600 }
    rotorcraft-section: { Min: 0, Max: 1, Priority: 60, EarliestTick: 800 }
    missile-rotorcraft-section:
      { Min: 0, Max: 2, Priority: 70, EarliestTick: 900 }
    fighter-section: { Min: 1, Max: 2, Priority: 60, EarliestTick: 1200 }
  Recipes:
    helipad: { Producer: construction-engineer, Action: site-helipad }
    airfield: { Producer: construction-engineer, Action: site-airfield }
