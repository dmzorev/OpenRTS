^sprite:
  Model:
    Kind: Sprite
    States:
      constructing: { Tint: [0.8, 0.9, 1.0], Opacity: 0.8 }
      lowpower: { Tint: [0.45, 0.45, 0.5] }
      damaged: { Tint: [0.64, 0.48, 0.40] }
      swimming: { Tint: [0.64, 0.86, 1.0], Scale: 0.94, Opacity: 0.88 }

infantry-rifle:
  Inherits: ^sprite
  Model:
    Parts:
      body:
        Facing: Weapon
        Mount: main
        Resource: res://resources/units/rifleman.tres
        Muzzle: [0.60, 0.30]
        Size: [1.25, 1.25]
        Pivot: [0.5, 0.64]
    Animations:
      idle: { Sequence: stand, Parts: [body] }
      move: { Sequence: travel, Parts: [body] }
      fire: { Sequence: shoot, Parts: [body], Recoil: 0.045, Flash: 0.24 }

infantry-rifleman:
  Inherits: infantry-rifle

infantry-sniper:
  Inherits: infantry-rifle

infantry-rocket:
  Inherits: infantry-rifle
  Model:
    Parts:
      body:
        Resource: res://resources/units/rocketeer.tres
        Muzzle: [0.60, 0.28]
        Pivot: [0.5, 0.64]
    Animations:
      fire: { Sequence: shoot, Parts: [body], Recoil: 0.09, Flash: 0.32 }

apc-machinegun:
  Inherits: ^sprite
  Model:
    Parts:
      body:
        Resource: res://resources/units/apc-hull.tres
        Size: [1.8, 1.8]
      turret:
        Parent: body
        Facing: Weapon
        Mount: main
        Resource: res://resources/units/apc-mg-turret.tres
        Muzzle: [0.50, 0.13]
        Size: [1.25, 1.25]
        Pivot: [0.5, 0.70]
        Offset: [0, -0.04]
        Layer: 1
    Animations:
      idle: { Sequence: stand, Parts: [body, turret] }
      move: { Sequence: travel, Parts: [body], Bob: 0.008 }
      fire: { Sequence: shoot, Parts: [turret], Recoil: 0.05, Flash: 0.30 }

apc-missiles:
  Inherits: apc-machinegun
  Model:
    Parts:
      turret:
        Resource: res://resources/units/apc-rocket-turret.tres
        Muzzle: [0.50, 0.20]
        Size: [1.25, 1.25]
        Pivot: [0.5, 0.5]
    Animations:
      fire: { Sequence: shoot, Parts: [turret], Recoil: 0.06, Flash: 0.40 }

tank:
  Inherits: apc-machinegun
  Model:
    Parts:
      body:
        Resource: res://resources/units/tank-hull.tres
        Size: [2.1, 2.1]
      turret:
        Resource: res://resources/units/tank-turret.tres
        Muzzle: [0.50, 0.09]
        Size: [1.8, 1.8]
        Pivot: [0.5, 0.73]
        Offset: [0, -0.07]
    Animations:
      fire: { Sequence: shoot, Parts: [turret], Recoil: 0.12, Flash: 0.38 }

infantry-grenade:
  Inherits: infantry-rifle

engineer:
  Inherits: ^sprite
  Model:
    Parts:
      body:
        Resource: res://resources/units/engineer.tres
        Size: [1.9, 1.9]
    Animations:
      idle: { Sequence: stand, Parts: [body] }
      move: { Sequence: travel, Parts: [body], Bob: 0.008 }
      repair: { Sequence: shoot, Parts: [body], Flash: 0.15 }

tank-mixed:
  Inherits: tank
  Model:
    Parts:
      radar:
        Parent: turret
        Resource: res://resources/buildings/radar.tres
        Size: [0.9, 0.9]
        Layer: 4
        Offset: [0, 0.1]
        Spin: 80
      turret:
        Resource: res://resources/units/mixed-turret.tres
        Size: [2.0, 2.0]
        Pivot: [0.5, 0.73]
    Animations:
      idle: { Sequence: stand, Parts: [body, turret, radar] }
      move: { Sequence: travel, Parts: [body, turret, radar] }
      fire: { Sequence: shoot, Parts: [body, turret, radar] }
      missiles: { Sequence: shoot, Parts: [turret, radar], Flash: 0.5 }

bunker-cannon:
  Inherits: tank
  Model:
    DamagedState: damaged
    DestroyedState: destroyed
    States:
      working: { Pulse: 0.05 }
      destroyed: { Tint: [0.72, 0.68, 0.62] }
    Parts:
      body:
        HiddenWhen: [destroyed]
        Resource: res://resources/units/bunker-base.tres
        Size: [2.6, 2.6]
      turret:
        HiddenWhen: [destroyed]
        Offset: [0, 0]
      ruins:
        Parent: body
        Resource: res://resources/buildings/building-ruins.tres
        Size: [2.6, 2.6]
        VisibleWhen: [destroyed]
    Animations:
      idle: { Sequence: stand, Parts: [body, turret, ruins] }
      move: { Sequence: stand, Parts: [body] }

bunker-mixed:
  Inherits: tank-mixed
  Model:
    DamagedState: damaged
    DestroyedState: destroyed
    States:
      working: { Pulse: 0.05 }
      destroyed: { Tint: [0.72, 0.68, 0.62] }
    Parts:
      radar: { HiddenWhen: [destroyed] }
      body:
        HiddenWhen: [destroyed]
        Resource: res://resources/units/bunker-base.tres
        Size: [2.6, 2.6]
      turret:
        HiddenWhen: [destroyed]
        Offset: [0, 0]
      ruins:
        Parent: body
        Resource: res://resources/buildings/building-ruins.tres
        Size: [2.6, 2.6]
        VisibleWhen: [destroyed]
    Animations:
      idle: { Sequence: stand, Parts: [body, turret, ruins, radar] }
      move: { Sequence: stand, Parts: [body] }

apc-upgradable:
  Inherits: apc-machinegun
  Model:
    States:
      rockets: {}
      cannon: {}
      firing-ports: {}
    Parts:
      turret: { HiddenWhen: [rockets, cannon] }
      rocket:
        Parent: body
        Facing: Weapon
        Mount: option-rocket
        Muzzle: [0.50, 0.20]
        Resource: res://resources/units/apc-rocket-turret.tres
        Size: [1.25, 1.25]
        Layer: 1
        VisibleWhen: [rockets]
      cannon:
        Parent: body
        Facing: Weapon
        Mount: option-cannon
        Muzzle: [0.50, 0.09]
        Resource: res://resources/units/tank-turret.tres
        Size: [1.45, 1.45]
        Pivot: [0.5, 0.73]
        Layer: 1
        VisibleWhen: [cannon]
      ports:
        Parent: body
        Resource: res://resources/buildings/work-strip.tres
        Size: [0.48, 0.48]
        Offset: [0, 0.43]
        Layer: 1
        VisibleWhen: [firing-ports]
    Animations:
      idle: { Sequence: stand, Parts: [body, turret, rocket, cannon, ports] }
      fire:
        {
          Sequence: shoot,
          Parts: [turret, rocket, cannon],
          Recoil: 0.06,
          Flash: 0.35,
        }
      construct:
        {
          Sequence: stand,
          Parts: [body, turret, rocket, cannon, ports],
          ScaleFrom: 0.85,
          OpacityFrom: 0.35,
        }

fighter:
  Inherits: ^sprite
  Model:
    States:
      airborne: { Tint: [1, 1, 1] }
    Parts:
      body:
        Resource: res://resources/units/fighter.tres
        Size: [2.4, 2.4]
        Facing: Body
    Animations:
      idle: { Sequence: stand, Parts: [body] }
      move: { Sequence: travel, Parts: [body] }
      fire: { Sequence: shoot, Parts: [body], Flash: 0.18 }

tiltrotor:
  Inherits: fighter
  Model:
    Parts:
      body:
        Resource: res://resources/units/tiltrotor.tres
        Size: [2.6, 2.6]
      rotor-left:
        Parent: body
        Resource: res://resources/units/rotor.tres
        Size: [0.6, 0.6]
        Offset: [-0.84, -0.09]
        Layer: 1
        VisibleWhen: [airborne]
        Spin: 720
      rotor-right:
        Parent: body
        Resource: res://resources/units/rotor.tres
        Size: [0.6, 0.6]
        Offset: [0.84, -0.09]
        Layer: 1
        VisibleWhen: [airborne]
        Spin: -720
    Animations:
      idle: { Sequence: stand, Parts: [body, rotor-left, rotor-right] }
      move: { Sequence: travel, Parts: [body, rotor-left, rotor-right] }
      fire:
        { Sequence: shoot, Parts: [body, rotor-left, rotor-right], Flash: 0.18 }

missile-tiltrotor:
  Inherits: ^sprite
  Model:
    States:
      airborne: { Tint: [1, 1, 1] }
    Parts:
      body:
        Resource: res://resources/units/missile-tiltrotor.tres
        Size: [3.05, 3.05]
        Mount: main
        MuzzleLocal: [0.476, 0.320, -0.333]
    Animations:
      idle: { Sequence: stand, Parts: [body] }
      move: { Sequence: stand, Parts: [body] }
      fire: { Sequence: stand, Parts: [body] }

radar-buggy:
  Inherits: ^sprite
  Model:
    Parts:
      body:
        {
          Resource: res://resources/units/radar-buggy.tres,
          Size: [2.8, 2.8],
          Facing: Body,
        }
    Animations:
      idle: { Sequence: stand, Parts: [body] }
      move: { Sequence: travel, Parts: [body] }
      fire: { Sequence: shoot, Parts: [body], Flash: 0.2 }
      construct: { Sequence: stand, Parts: [body] }
      door: { Sequence: stand, Parts: [body] }
      produce: { Sequence: stand, Parts: [body] }

stealth-truck:
  Inherits: ^sprite
  Model:
    Parts:
      rotor:
        Parent: body
        Resource: res://resources/units/stealth-rotor.tres
        Size: [1.9, 1.9]
        Layer: 4
        Spin: 140
        EmitterSpin: true
      body:
        {
          Resource: res://resources/units/stealth-truck.tres,
          Size: [3.8, 3.8],
          Facing: Body,
        }
    Animations:
      idle: { Sequence: stand, Parts: [body, rotor] }
      move: { Sequence: travel, Parts: [body, rotor] }
      fire: { Sequence: shoot, Parts: [body, rotor], Flash: 0.2 }
      construct: { Sequence: stand, Parts: [body, rotor] }
      door: { Sequence: stand, Parts: [body, rotor] }
      produce: { Sequence: stand, Parts: [body, rotor] }

stealth-generator:
  Inherits: ^sprite
  Model:
    States:
      working: { Pulse: 0.05 }
      destroyed: { Tint: [0.4, 0.4, 0.4] }
    Parts:
      rotor:
        Parent: body
        Resource: res://resources/units/stealth-rotor.tres
        Size: [2.6, 2.6]
        Layer: 4
        Spin: 140
        Offset: [0.0, -0.5]
        EmitterSpin: true
      body:
        {
          Resource: res://resources/units/stealth-generator.tres,
          Size: [5.2, 5.2],
          Facing: Body,
        }
    Animations:
      idle: { Sequence: stand, Parts: [body, rotor] }
      move: { Sequence: travel, Parts: [body, rotor] }
      fire: { Sequence: shoot, Parts: [body, rotor], Flash: 0.2 }
      construct: { Sequence: stand, Parts: [body, rotor] }
      door: { Sequence: stand, Parts: [body, rotor] }
      produce: { Sequence: stand, Parts: [body, rotor] }

engineering-tiltrotor:
  Inherits: tiltrotor
  Model:
    Parts:
      body:
        {
          Resource: res://resources/units/engineering-tiltrotor.tres,
          Size: [3.2, 3.2],
        }
      rotor-left: { Size: [0.86, 0.86], Offset: [-1.0, -0.16] }
      rotor-right: { Size: [0.86, 0.86], Offset: [1.0, -0.16] }
    Animations:
      repair:
        { Sequence: shoot, Parts: [body, rotor-left, rotor-right], Flash: 0.12 }

supply-tiltrotor:
  Inherits: tiltrotor
  Model:
    Parts:
      body:
        {
          Resource: res://resources/units/supply-tiltrotor.tres,
          Size: [3.2, 3.2],
        }
      rotor-left: { Size: [0.78, 0.78], Offset: [-1.0, -0.38] }
      rotor-right: { Size: [0.78, 0.78], Offset: [1.0, -0.38] }
    States:
      loaded: { Tint: [0.9, 1.1, 0.9] }

heavy-air-transport:
  Inherits: ^sprite
  Model:
    States:
      airborne: { Tint: [1, 1, 1] }
    Parts:
      body:
        Resource: res://resources/units/heavy-air-transport-top.tres
        Size: [5.7, 5.7]
        HiddenWhen: [airborne]
      flight:
        Resource: res://resources/units/heavy-air-transport-top-airborne.tres
        Size: [5.7, 5.7]
        VisibleWhen: [airborne]
        LoopAnimation: move
        LoopWhen: airborne
    Animations:
      idle: { Sequence: stand, Parts: [body, flight] }
      move: { Sequence: travel, Parts: [flight] }
      fire: { Sequence: stand, Parts: [body] }
