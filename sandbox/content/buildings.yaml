^building:
  Buildable: {Ticks: 125, Cost: 500, Kind: PlaceBuilding, PlacementRadius: 102400}
  Health: {HP: 1000, Armor: Building}
  Capturable: {}
  Economy: {Energy: -20}
  Movement: {Enabled: false}
  Presentation:
    Animations: [idle, construct, produce, door]
    States: [damaged, working, destroyed, lowpower]
  Footprint:
    Types:
      '#': {Traverse: false, CanStop: false}
      '+': {Traverse: true, CanStop: false, Terrain: road, Targetable: false}
      '=': {Traverse: true, CanStop: true, Terrain: road, Targetable: false}

power-plant:
  Inherits: ^building
  Economy: {Energy: 100}
  Footprint: {Rows: ['###', '###']}
  Presentation: {Model: power-plant, Name: Электростанция}

barracks:
  Inherits: ^building
  TaskQueues:
    Queues:
      infantry: {Capacity: 20, Payment: Upfront, WorkingState: working, ExitAnimation: door, Exit: [0, 1024]}
  Actions:
    Definitions:
      rifleman: {Unit: rifleman}
      rocketeer: {Unit: rocketeer}
  ActionPanel:
    Buttons:
      rifleman: {Label: Автоматчик}
      rocketeer: {Label: Ракетчик}
  Footprint: {Rows: ['####', '#==#', '#++#']}
  Presentation: {Model: barracks, Name: Бараки}

factory:
  Inherits: ^building
  TaskQueues:
    Queues:
      vehicles: {Capacity: 12, Payment: Progressive, WorkingState: working, ExitAnimation: door, Exit: [1536, 1536]}
  Actions:
    Definitions:
      apc: {Unit: apc-mg}
      tank: {Unit: large-tank, Cost: 180, Ticks: 150}
      repair: {Mount: repair}
  ActionPanel:
    Buttons:
      apc: {Label: БТР, Order: 0}
      tank: {Label: Танк, Order: 1}
      repair: {Label: Ремонт, Cursor: repair, Order: 2}
  Footprint: {Rows: ['#####', '###==', '###==', '###++']}
  Armaments:
    Mounts:
      repair: {Weapon: repair, Animation: produce}
  Presentation: {Model: factory, Name: Завод · ремонтная зона}

headquarters:
  Inherits: ^building
  Footprint: {Rows: ['####', '####', '####']}
  Presentation: {Model: headquarters, Name: HQ · Радар}

construction-yard:
  Inherits: ^building
  Economy: {Energy: 0}
  TaskQueues:
    Queues:
      construction: {Capacity: 12, Payment: Upfront, WorkingState: working}
      vehicles: {Capacity: 5, Payment: OnCompletion, WorkingState: working, ExitAnimation: door, Exit: [1536, 1536]}
  Actions:
    Definitions:
      power: {Unit: power-plant, Queue: construction}
      barracks: {Unit: barracks, Queue: construction}
      factory: {Unit: factory, Queue: construction}
      engineer: {Unit: engineer, Queue: vehicles}
  ActionPanel:
    Buttons:
      power: {Label: Электростанция, Order: 0}
      barracks: {Label: Бараки, Order: 1}
      factory: {Label: Завод, Order: 2}
      engineer: {Label: Инженер, Order: 3}
  Footprint: {Rows: ['#####', '###==', '###==', '###++']}
  Presentation: {Model: construction-yard, Name: Construction Yard}

mine:
  Inherits: ^building
  -Buildable:
  Health: {Destruction: Neutralize}
  Economy: {Energy: 0, Income: 40, Interval: 100}
  Footprint: {Rows: ['###', '###', '#+#', '#+#']}
  Presentation: {Model: mine, Name: Шахта}

oil-derrick:
  Inherits: ^building
  -Buildable:
  Health: {Destruction: Neutralize}
  Economy: {Energy: 0, Income: 30, Interval: 100}
  Footprint: {Rows: ['###', '###', '###']}
  Presentation: {Model: oil-derrick, Name: Нефтяная вышка}

^nature:
  Health: {HP: 600, Armor: Building, Destruction: Invulnerable}
  Movement: {Enabled: false}
  Presentation: {Animations: [idle], States: [destroyed]}

nature-trees:
  Inherits: ^nature
  Footprint:
    Rows: ['ttt', 'ttt']
    Types: {t: {Traverse: true, Terrain: forest}}
  Presentation: {Model: nature-trees, Name: Деревья · лес}

nature-rocks:
  Inherits: ^nature
  Footprint:
    Rows: ['rr', 'rr']
    Types: {r: {Terrain: mountains}}
  Presentation: {Model: nature-rocks, Name: Груда камней}

nature-cliff:
  Inherits: ^nature
  Footprint:
    Rows: ['.rr', 'rrr', 'rr.']
    Types: {r: {Terrain: mountains}}
  Presentation: {Model: nature-cliff, Name: Скала · горы}

nature-debris:
  Inherits: ^nature
  Footprint:
    Rows: ['rrr', 'rrr']
    Types: {r: {Traverse: false, CanStop: false}}
  Presentation: {Model: nature-debris, Name: Обломки}

light-infantry:
  Inherits: rifleman
  Body: {Kind: Circle, Radius: 160}
  Presentation: {Name: Пехота · радиус 160}

medium-apc:
  Inherits: apc-mg
  Body: {Kind: Circle, Radius: 384}
  Presentation: {Name: БТР · радиус 384}

large-tank:
  Inherits: tank
  Body: {Kind: Circle, Radius: 640}
  Presentation: {Name: Танк · радиус 640}

box-vehicle:
  Inherits: tank
  Body: {Kind: Box, HalfSize: [640, 320]}
  Presentation: {Name: Техника · прямоугольное тело}
