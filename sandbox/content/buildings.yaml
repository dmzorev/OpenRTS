^building:
  Buildable: {Ticks: 125, Cost: 500, Kind: PlaceBuilding, PlacementRadius: 102400}
  Health: {HP: 1000, Armor: Building}
  Capturable: {}
  Economy: {Energy: -20}
  Movement: {Enabled: false, Locomotor: tracked}
  Presentation:
    Animations: [idle, construct, produce, door]
    States: [damaged, working, destroyed, lowpower, constructing]
  Footprint:
    Types:
      '#': {Traverse: false, CanStop: false}
      '+': {Traverse: true, CanStop: false, Terrain: road, Targetable: false}
      '=': {Traverse: true, CanStop: true, Terrain: road, Targetable: false}

power-plant:
  Inherits: ^building
  Economy: {Energy: 100}
  Footprint: {Rows: ['###', '###']}
  Presentation: {Model: power-plant, Name: Электростанция}

barracks:
  Inherits: ^building
  TaskQueues:
    Queues:
      infantry: {Capacity: 20, Payment: Upfront, WorkingState: working, ExitAnimation: door, Exit: [0, 1024]}
  Actions:
    Definitions:
      rifleman: {Unit: rifleman}
      sniper: {Unit: sniper}
      rocketeer: {Unit: rocketeer}
  ActionPanel:
    Buttons:
      rifleman: {Label: Автоматчик}
      sniper: {Label: Снайпер}
      rocketeer: {Label: Ракетчик}
  Footprint: {Rows: ['####', '#==#', '#++#']}
  Presentation: {Model: barracks, Name: Бараки}

factory:
  Inherits: ^building
  TaskQueues:
    Queues:
      vehicles: {Capacity: 12, Payment: Progressive, WorkingState: working, ExitAnimation: door, Exit: [1536, 1536]}
  Actions:
    Definitions:
      apc: {Unit: apc-mg}
      tank: {Unit: large-tank, Cost: 180, Ticks: 150}
      repair: {Mount: repair, AutoCast: true}
  ActionPanel:
    Buttons:
      apc: {Label: БТР, Order: 0}
      tank: {Label: Танк, Order: 1}
      repair: {Label: Ремонт, Cursor: repair, Order: 2}
  Footprint: {Rows: ['#####', '###==', '###==', '###++']}
  Armaments:
    Mounts:
      repair: {Weapon: factory-repair, Animation: produce}
  Presentation: {Model: factory, Name: Завод · ремонтная зона}

headquarters:
  Inherits: ^building
  Footprint: {Rows: ['####', '####', '####']}
  Presentation: {Model: headquarters, Name: HQ · Радар}

construction-yard:
  Inherits: ^building
  Economy: {Energy: 0}
  Builder: {Range: 12288}
  TaskQueues:
    Queues:
      vehicles: {Capacity: 5, Payment: OnCompletion, WorkingState: working, ExitAnimation: door, Exit: [1536, 1536]}
  Actions:
    Definitions:
      build: {Build: true, AutoCast: true}
      engineer: {Unit: construction-engineer, Queue: vehicles}
      site-power: {Unit: power-plant, OnSite: true}
      site-barracks: {Unit: barracks, OnSite: true}
      site-factory: {Unit: factory, OnSite: true}
      site-turret: {Unit: bunker-cannon, OnSite: true}
  ActionPanel:
    Buttons:
      build: {Label: Помочь строить, Cursor: build, Order: 0}
      engineer: {Label: Инженер, Order: 3}
      site-power: {Label: Строить электростанцию, Hotkey: T, Order: 4}
      site-barracks: {Label: Строить бараки, Hotkey: Y, Order: 5}
      site-factory: {Label: Строить завод, Hotkey: U, Order: 6}
      site-turret: {Label: Строить турель, Hotkey: I, Order: 7}
  Footprint: {Rows: ['#####', '###==', '###==', '###++']}
  Presentation: {Model: construction-yard, Name: Construction Yard}

mine:
  Inherits: ^building
  Buildable: {Ticks: 150, Cost: 900}
  Health: {Destruction: Neutralize}
  Economy: {Energy: 0, Income: 40, Interval: 100}
  Footprint: {Rows: ['###', '###', '#+#', '#+#']}
  Presentation: {Model: mine, Name: Шахта}

oil-derrick:
  Inherits: ^building
  Buildable: {Ticks: 125, Cost: 700}
  Health: {Destruction: Neutralize}
  Economy: {Energy: 0, Income: 30, Interval: 100}
  Footprint: {Rows: ['###', '###', '###']}
  Presentation: {Model: oil-derrick, Name: Нефтяная вышка}

^nature:
  Health: {HP: 600, Armor: Building, Destruction: Invulnerable}
  Movement: {Enabled: false}
  Presentation: {Animations: [idle], States: [destroyed]}

nature-trees:
  Inherits: ^nature
  Footprint:
    Rows: ['ttt', 'ttt']
    Types: {t: {Traverse: true, Terrain: forest}}
  Presentation: {Model: nature-trees, Name: Деревья · лес}

nature-rocks:
  Inherits: ^nature
  Footprint:
    Rows: ['rr', 'rr']
    Types: {r: {Terrain: mountains}}
  Presentation: {Model: nature-rocks, Name: Груда камней}

nature-cliff:
  Inherits: ^nature
  Footprint:
    Rows: ['.rr', 'rrr', 'rr.']
    Types: {r: {Terrain: mountains}}
  Presentation: {Model: nature-cliff, Name: Скала · горы}

nature-debris:
  Inherits: ^nature
  Footprint:
